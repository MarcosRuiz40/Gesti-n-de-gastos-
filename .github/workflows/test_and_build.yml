name: test_and_build

on: #donde se va a ejecutar
  push: # cada vez que se haga un push en la rama main
    branches: [ main ] 
  pull_request:
    branches: [main]
  
jobs: #Esto es un conjunto de pasos que se deben ejecutar en la acctions 
  build: #indicamos todo el proceso de construcción
    runs-on: ubuntu-latest #que maquina lo vamos a correr
    permissions: 
       contents: write

    steps: #definimos los pasos que debe seguir
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.14.7'

      - name: Run Script python
        run: printf "1\nejemplo\nejemplo\n200\n2\n3\n4\n6\n5\n5\n7\n" | python gestión_de_gastos/ProcesadorGastos.py #ejecutamos el codigo

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Automated Change
          commit_user_name: Bot [GitHub Actions]
          
        
