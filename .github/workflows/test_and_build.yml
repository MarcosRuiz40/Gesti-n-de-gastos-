name: test_and_build

on: #donde se va a ejecutar
  push: # cada vez que se haga un push en la rama main
    branches: [ main ] 
jobs: #Esto es un conjunto de pasos que se deben ejecutar en la acctions 
  build: #indicamos todo el proceso de construcción
    runs-on: ubuntu-latest #que maquina lo vamos a correr

    steps: #definimos los pasos que debe seguir
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.14.7'

      - name: Run Script python
        run: python ./ProcesadorGastos.py #ejecutamos el codigo
